name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in pyproject.toml.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Full matrix on Linux; spot-check the ends of the range elsewhere.
        exclude:
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.12"}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # HiGHS ships as a wheel on every platform in the matrix, so solver-backed tests
    # run everywhere instead of being silently skipped.
    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Report available solvers
      run: |
        python -c "
        from pyomo.environ import SolverFactory
        for name in ['cbc', 'glpk', 'appsi_highs']:
            print(f'{name}: {SolverFactory(name).available(exception_flag=False)}')
        "

    - name: Run tests
      run: python -m pytest

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # The package must remain importable and the non-solver tests must pass with no
  # MILP backend installed at all.
  test-no-solver:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install without any solver
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install pytest pytest-cov matplotlib pandas

    - name: Verify no solver is available
      run: |
        python -c "
        from pyomo.environ import SolverFactory
        available = [s for s in ['glpk', 'cbc', 'gurobi', 'cplex', 'appsi_highs']
                     if SolverFactory(s).available(exception_flag=False)]
        assert not available, f'Expected no solvers, found: {available}'
        print('Confirmed: no MILP solver installed')
        "

    - name: Run solver-independent tests
      run: python -m pytest -m "not solver" --cov-fail-under=0

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Run black (code formatting)
      run: black --check --diff rcpsp_cf_ivfth/ tests/ scripts/

    - name: Run isort (import sorting)
      run: isort --check-only --diff rcpsp_cf_ivfth/ tests/ scripts/

    - name: Run flake8 (linting)
      run: flake8 rcpsp_cf_ivfth/ tests/ scripts/

    - name: Run mypy (type checking)
      run: mypy rcpsp_cf_ivfth/ --ignore-missing-imports
      continue-on-error: true
